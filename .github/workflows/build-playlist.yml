
name: Build IPTV Playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          python3 - <<'PY'
          import urllib.request
          import re

          sources = [
              (
                  "https://iptv-org.github.io/iptv/categories/sports.m3u",
                  "THE THAO QUOC TE"
              ),
              (
                  "https://iptv-org.github.io/iptv/countries/vn.m3u",
                  "KENH VIET NAM"
              )
          ]

          all_channels = []
          seen = set()

          def parse_playlist(content, group):
              channels = []
              record = None

              def save():
                  if not record or not record["url"]:
                      return

                  info = record["info"]

                  if re.search(r'group-title="[^"]*"', info):
                      info = re.sub(
                          r'group-title="[^"]*"',
                          f'group-title="{group}"',
                          info,
                          count=1
                      )
                  else:
                      info = info.replace(
                          ",", f' group-title="{group}",', 1
                      )

                  channels.append([
                      info,
                      *record["extra"],
                      record["url"]
                  ])

              for line in content.splitlines():
                  s = line.strip()

                  if s.startswith("#EXTINF:"):
                      save()
                      record = {
                          "info": line,
                          "extra": [],
                          "url": None
                      }

                  elif record is not None:
                      if not s:
                          continue
                      elif s.startswith("#"):
                          record["extra"].append(line)
                      else:
                          record["url"] = s
                          save()
                          record = None

              save()
              return channels

          for url, group in sources:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=60) as response:
                  content = response.read().decode(
                      "utf-8-sig", errors="replace"
                  )

              channels = parse_playlist(content, group)

              for channel in channels:
                  stream = channel[-1]

                  if stream not in seen:
                      seen.add(stream)
                      all_channels.extend(channel)

          if not all_channels:
              raise Exception("No channels found!")

          with open("bongda.m3u", "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")
              f.write("\n".join(all_channels))
              f.write("\n")

          print("Total channels:", len(seen))
          PY

      - name: Save playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bongda.m3u
          git diff --cached --quiet || (
            git commit -m "Build IPTV playlist"
            git push
          )
