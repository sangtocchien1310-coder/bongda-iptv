name: Build IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build playlist from Gavang API
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime

          API = "https://gavangtv-api.adviceme.io/api/v1/matches?webType=gavang"

          req = urllib.request.Request(
              API,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              data = json.loads(response.read().decode("utf-8"))

          if data.get("code") != "0000":
              raise Exception("Gavang API returned an error")

          matches = data.get("data", {})
          channels = []
          seen = set()

          for match in matches.values():
              home = match.get("homeTeam", {}).get("name", "Unknown")
              away = match.get("awayTeam", {}).get("name", "Unknown")
              competition = match.get("competition", {}).get("name", "BONG DA")

              status = match.get("matchStatus", "")
              if status not in ("live", "scheduled"):
                  continue

              for appointment in match.get("anchorAppointmentVoList", []):
                  for stream in appointment.get("streamUrls", []):
                      if not stream.endswith(".m3u8"):
                          continue

                      if stream in seen:
                          continue

                      seen.add(stream)
                      title = f"{home} vs {away}"

                      channels.append(
                          f'#EXTINF:-1 group-title="{competition}",{title}'
                      )
                      channels.append(stream)

          if not channels:
              raise Exception("No authorized M3U8 streams found")

          with open("bongda.m3u", "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")
              f.write("\n".join(channels))
              f.write("\n")

          print("Total matches/streams:", len(seen))
          print("Updated:", datetime.utcnow().isoformat())
          PY

      - name: Save playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bongda.m3u
          git diff --cached --quiet || (
            git commit -m "Update Gavang IPTV playlist"
            git push
          )
